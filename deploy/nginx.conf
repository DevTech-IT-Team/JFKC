# Example nginx 1.24 site for the JF Knowledge Centre static build.
#
# The Vite build writes one HTML file per public route:
#   dist/index.html
#   dist/about/index.html and dist/about.html
#   dist/services/content-design/index.html and dist/services/content-design.html
#   dist/404.html
#
# Apply this on the server that serves https://jfknowledge.com/ :
#   1. Replace `root` with the directory that contains the uploaded `dist` files.
#   2. Merge these directives into the live server block (keep the existing
#      TLS certificates). Remove any `try_files ... /index.html` fallback —
#      that fallback is what makes unknown URLs return HTTP 200.
#   3. Do not set `Cache-Control: no-cache` on `/assets/`. Hashed files there
#      must be cached as immutable. HTML keeps `no-cache` so new prerendered
#      pages are picked up after each deploy.
#   4. Test and reload:
#        sudo nginx -t && sudo systemctl reload nginx
#
# Trailing slashes: `/about/` 301s to `/about` when that page exists on disk,
# so the URL matches the slashless canonical. The query string is kept. `/`
# is not redirected. A trailing slash with no file is a 404, except one
# unknown slug under /portfolio, /services, or /blog, which still serves the
# app so it can redirect in the browser.
#
# Legacy URLs that still receive impressions 301 to the current page. The
# query string is kept. Nothing else is redirected:
#   /about-us                         /about
#   /about-us-menu/<anything>         /about
#   /term_conditions                  /terms
#   /term_conditions/<anything>       /terms
#   /careers                          /career
#   /careers/<anything>               /career
#   /product_detail/<anything>        /products
#
# Check after reload:
#   curl -sI https://jfknowledge.com/assets/<hashed>.js | grep -i -E 'content-encoding|cache-control'
#   curl -sI https://jfknowledge.com/about/ | head -n 5
#   curl -sI https://jfknowledge.com/this-does-not-exist-xyz | head -n 1
# The asset response should show `content-encoding: gzip` and a long
# `max-age=31536000, immutable`. `/about/` should be `301` to `/about`.
# The unknown URL should show `HTTP/1.1 404`.

server {
    listen 80;
    listen [::]:80;
    server_name jfknowledge.com www.jfknowledge.com;

    root /var/www/jfknowledge/dist;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Vite fingerprints every file in /assets/. Safe to cache for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    # /404.html is the error document. /404 must not be served as HTTP 200.
    location = /404 {
        return 404;
    }

    # Legacy permanent redirects. `<anything>` is at least one character, so
    # /about-us-menu and /product_detail alone are not redirected.
    location = /about-us {
        return 301 /about$is_args$args;
    }

    location ~ ^/about-us-menu/.+ {
        return 301 /about$is_args$args;
    }

    location = /term_conditions {
        return 301 /terms$is_args$args;
    }

    location ~ ^/term_conditions/.+ {
        return 301 /terms$is_args$args;
    }

    location = /careers {
        return 301 /career$is_args$args;
    }

    location ~ ^/careers/.+ {
        return 301 /career$is_args$args;
    }

    location ~ ^/product_detail/.+ {
        return 301 /products$is_args$args;
    }

    # /route/ → /route when the slashless page exists. Must be above the
    # prefix locations: the first matching regex wins.
    location ~ ^/(?<section>portfolio|services|blog)/(?<slug>[^/]+)/$ {
        if (-f $document_root/$section/$slug/index.html) {
            return 301 /$section/$slug$is_args$args;
        }
        if (-f $document_root/$section/$slug.html) {
            return 301 /$section/$slug$is_args$args;
        }
        rewrite ^ /index.html last;
    }

    location ~ ^(?<slashless>/(?:[^/]+(?:/[^/]+)*))/$ {
        if (-f $document_root$slashless/index.html) {
            return 301 $slashless$is_args$args;
        }
        if (-f $document_root$slashless.html) {
            return 301 $slashless$is_args$args;
        }
        if (-f $document_root$slashless) {
            return 301 $slashless$is_args$args;
        }
        return 404;
    }

    # Slashless routes exist as dist/<route>/index.html and dist/<route>.html.
    # Unknown URLs fall through to a real 404. /index.html is the homepage,
    # so it is not the final fallback.
    # One unknown slug under /portfolio, /services, or /blog still boots the
    # app so the page can redirect in the browser. Deeper paths do not match.
    # Trailing slashes are handled above.
    location ~ ^/(?:portfolio|services|blog)/[^/]+$ {
        try_files $uri $uri/index.html $uri.html /index.html;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;
}
