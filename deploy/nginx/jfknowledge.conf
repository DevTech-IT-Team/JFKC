# jfknowledge.com — serve the Vite build directly.
#
# Replaces the current nginx proxy in front of `vite preview` (that proxy is
# why every unknown URL returns HTTP 200 with Vary: Origin and a weak ETag).
# This file does not use default_server, so other vhosts on the box are left
# alone.
#
# Redirects, unchanged from the live site:
#   http://jfknowledge.com/*       301 https://jfknowledge.com/*
#   http://www.jfknowledge.com/*   301 https://jfknowledge.com/*
#   https://www.jfknowledge.com/*  301 https://jfknowledge.com/*
#
# Routes (src/App.jsx + public/sitemap.xml):
#   Exact: / /about /contact /career /privacy /terms /portfolio /services
#          /products /blog /training-modules /training-delivery
#          /immersive-learning /learning-technology
#   Dynamic prefixes (one :slug segment): /portfolio/ /services/ /blog/
#   React Router also matches a single trailing slash on those routes.
#
# Prerender writes dist/<route>/index.html and dist/<route>.html (the
# homepage is dist/index.html). Slashless sitemap URLs such as /about must
# serve that route's file. `/about/` 301s to `/about` when the file exists,
# so the response matches the slashless canonical. The query string is kept.
# `/` is not redirected. dist/index.html is the homepage, so it is not a
# fallback for every route.
#
# Legacy URLs that still receive impressions 301 to the current page.
# Nothing else is redirected:
#   /about-us and /about-us-menu/<anything>   → /about
#   /term_conditions and /term_conditions/<anything> → /terms
#   /careers and /careers/<anything>          → /career
#   /product_detail/<anything>                → /products
#
# Anything else is a real HTTP 404, with dist/404.html as the body
# (`error_page 404 /404.html`). Unknown slugs under the three dynamic
# prefixes still return 200: they match /:slug and the page redirects
# client-side. Deeper paths such as /blog/a/b do not match and return 404.
#
# Before reloading: set `root` to the deployed dist/ directory (the folder
# that contains index.html, 404.html, and assets/). If `nginx -t` cannot
# find the ssl include files, copy the ssl_certificate lines from the
# current site instead of these Let's Encrypt defaults.

# Port 80: http → https apex, including www.
server {
    listen 80;
    server_name jfknowledge.com www.jfknowledge.com;
    return 301 https://jfknowledge.com$request_uri;
}

# HTTPS www → apex.
server {
    listen 443 ssl http2;
    server_name www.jfknowledge.com;

    ssl_certificate     /etc/letsencrypt/live/jfknowledge.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jfknowledge.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://jfknowledge.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name jfknowledge.com;

    ssl_certificate     /etc/letsencrypt/live/jfknowledge.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jfknowledge.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/jfknowledge/dist;
    index index.html;

    gzip on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json text/xml application/xml image/svg+xml;

    error_page 404 /404.html;

    # Hashed build output. ^~ so a missing asset is a 404, not the SPA shell.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The error document itself (copy of the built app, robots noindex).
    # `always` is required: add_header is skipped for non-2xx/3xx responses.
    location = /404.html {
        add_header Cache-Control "no-cache" always;
    }

    # /404.html is the error document. /404 must not be served as HTTP 200.
    location = /404 {
        return 404;
    }

    # Legacy permanent redirects. `<anything>` is at least one character, so
    # /about-us-menu and /product_detail alone are not redirected.
    location = /about-us {
        return 301 /about$is_args$args;
    }

    location ~ ^/about-us-menu/.+ {
        return 301 /about$is_args$args;
    }

    location = /term_conditions {
        return 301 /terms$is_args$args;
    }

    location ~ ^/term_conditions/.+ {
        return 301 /terms$is_args$args;
    }

    location = /careers {
        return 301 /career$is_args$args;
    }

    location ~ ^/careers/.+ {
        return 301 /career$is_args$args;
    }

    location ~ ^/product_detail/.+ {
        return 301 /products$is_args$args;
    }

    # /route/ → /route when the slashless page exists. The first matching
    # regex wins, so this stays above the other prefix locations.
    location ~ ^/(?<section>portfolio|services|blog)/(?<slug>[^/]+)/$ {
        if (-f $document_root/$section/$slug/index.html) {
            return 301 /$section/$slug$is_args$args;
        }
        if (-f $document_root/$section/$slug.html) {
            return 301 /$section/$slug$is_args$args;
        }
        rewrite ^ /index.html last;
    }

    location ~ ^(?<slashless>/(?:[^/]+(?:/[^/]+)*))/$ {
        if (-f $document_root$slashless/index.html) {
            return 301 $slashless$is_args$args;
        }
        if (-f $document_root$slashless.html) {
            return 301 $slashless$is_args$args;
        }
        if (-f $document_root$slashless) {
            return 301 $slashless$is_args$args;
        }
        return 404;
    }

    # Sitemap URLs have no trailing slash. Each prerendered route is stored as
    # dist/<route>/index.html and dist/<route>.html. /index.html is only the
    # homepage, so it is not the fallback for these paths. Trailing slashes
    # are redirected above.
    #
    # One unknown slug under /portfolio, /services, or /blog still boots the
    # app (client-side redirect). /portfolio/a/b and every other miss are 404.
    location ~ ^/(?:portfolio|services|blog)/[^/]+$ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html $uri.html /index.html;
    }

    # Real files (favicon, sitemap, robots, og-image, logobg) and every
    # prerendered page. No homepage fallback.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html $uri.html =404;
    }
}
